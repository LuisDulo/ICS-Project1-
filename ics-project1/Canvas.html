<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Editor</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f5f6fa;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .navbar nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #555;
    }

    .navbar nav a.active {
      color: #6366f1;
      font-weight: bold;
    }

    .editor {
      display: flex;
      height: calc(100vh - 70px);
    }

    .sidebar {
      width: 260px;
      padding: 1rem;
      background: #fff;
      border-right: 1px solid #ddd;
      overflow-y: auto;
    }

    .sidebar h3 {
      margin-top: 0;
    }

    .sidebar section {
      margin-bottom: 1.5rem;
    }

    .sidebar button, .sidebar input[type="file"] {
      display: block;
      margin: 0.5rem 0;
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      background: #f1f1f1;
      border-radius: 5px;
      cursor: pointer;
    }

    canvas {
      margin: auto;
      background: #fff;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">🎨 ArtHub</div>
    <nav>
      <a href="home.html">Home</a>
      <a href="editor.html" class="active">Canvas Editor</a>
      <a href="marketplace.html">Marketplace</a>
      <a href="Designers.html">Hire a Designer</a>
      <a href="#">User Profiles</a>
    </nav>
    <input type="search" placeholder="Search ArtHub...">
  </header>

  <div class="editor">
    <aside class="sidebar">
      <h3>Editor Tools</h3>
      <section>
        <strong>Drawing Tools</strong>
        <button onclick="setTool('brush')">🖌️ Brush</button>
        <button onclick="setTool('eraser')">🧽 Eraser</button>
      </section>

      <section>
        <strong>Shapes</strong>
        <button onclick="addShape('rect')">▭ Rectangle</button>
        <button onclick="addShape('circle')">⚪ Circle</button>
      </section>

      <section>
        <strong>Text</strong>
        <button onclick="addText()">Add Text</button>
      </section>

      <section>
        <strong>Assets</strong>
        <input type="file" id="upload" accept="image/*">
      </section>

      <section>
        <strong>Actions</strong>
        <button onclick="undo()">↶ Undo</button>
        <button onclick="redo()">↷ Redo</button>
        <button onclick="exportImage()">📷 Export</button>
      </section>
    </aside>

    <main>
      <canvas id="canvas" width="1000" height="600"></canvas>
    </main>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let tool = "brush";
    let drawing = false;
    let history = [];
    let redoStack = [];

    let elements = [];
    let currentElement = null;

    function setTool(selectedTool) {
      tool = selectedTool;
    }

    canvas.addEventListener("mousedown", (e) => {
      const { offsetX, offsetY } = e;
      if (tool === "brush" || tool === "eraser") {
        drawing = true;
        ctx.beginPath();
        ctx.moveTo(offsetX, offsetY);
      } else {
        for (const el of elements.reverse()) {
          if (offsetX >= el.x && offsetX <= el.x + (el.width || 100) && offsetY >= el.y && offsetY <= el.y + (el.height || 100)) {
            currentElement = el;
            break;
          }
        }
      }
    });

    canvas.addEventListener("mousemove", (e) => {
      const { offsetX, offsetY } = e;
      if (drawing) {
        ctx.lineTo(offsetX, offsetY);
        ctx.strokeStyle = tool === "eraser" ? "#fff" : "#000";
        ctx.lineWidth = tool === "eraser" ? 20 : 2;
        ctx.stroke();
      } else if (currentElement) {
        currentElement.x = offsetX;
        currentElement.y = offsetY;
        drawElements();
      }
    });

    canvas.addEventListener("mouseup", () => {
      drawing = false;
      ctx.closePath();
      currentElement = null;
      saveState();
    });

    function addShape(type) {
      const shape = {
        id: Date.now(),
        type,
        x: 100,
        y: 100,
        width: 100,
        height: 100,
        draggable: true,
      };
      elements.push(shape);
      drawElements();
      saveState();
    }

    function addText() {
      const text = {
        type: "text",
        content: "Edit me",
        x: 150,
        y: 150,
        font: "20px Arial",
        draggable: true,
      };
      elements.push(text);
      drawElements();
      saveState();
    }

    function drawElements() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const el of elements) {
        if (el.type === "rect") {
          ctx.fillStyle = "#6366f1";
          ctx.fillRect(el.x, el.y, el.width, el.height);
        } else if (el.type === "circle") {
          ctx.beginPath();
          ctx.arc(el.x + 50, el.y + 50, 50, 0, Math.PI * 2);
          ctx.fillStyle = "#6366f1";
          ctx.fill();
        } else if (el.type === "text") {
          ctx.font = el.font;
          ctx.fillStyle = "#000";
          ctx.fillText(el.content, el.x, el.y);
        } else if (el.type === "image") {
          ctx.drawImage(el.img, el.x, el.y, el.width, el.height);
        }
      }
    }

    function saveState() {
      history.push(JSON.stringify(elements));
      redoStack = [];
    }

    function undo() {
      if (history.length > 1) {
        redoStack.push(history.pop());
        elements = JSON.parse(history[history.length - 1]);
        drawElements();
      }
    }

    function redo() {
      if (redoStack.length > 0) {
        const redoState = redoStack.pop();
        history.push(redoState);
        elements = JSON.parse(redoState);
        drawElements();
      }
    }

    document.getElementById("upload").addEventListener("change", function (e) {
      const file = e.target.files[0];
      const img = new Image();
      img.onload = () => {
        elements.push({
          type: "image",
          img,
          x: 100,
          y: 100,
          width: 200,
          height: 200
        });
        drawElements();
        saveState();
      };
      img.src = URL.createObjectURL(file);
    });

    function exportImage() {
      const image = canvas.toDataURL("image/png");
      const link = document.createElement("a");
      link.download = "design.png";
      link.href = image;
      link.click();
    }

    // Initial save
    saveState();
  </script>
</body>
</html>
